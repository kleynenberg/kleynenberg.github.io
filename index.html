        let activeCmd = "";
        let argPos = 0;

        while ((m = re.exec(d)) !== null) {
          if (m[1]) {
            activeCmd = m[1];
            argPos = 0;
            tokens.push(activeCmd);
          } else if (m[2]) {
            const upper = activeCmd.toUpperCase();
            if (upper === "A") {
              const mod = argPos % 7;
              if ((mod === 3 || mod === 4) && m[2].length > 1 && (m[2][0] === "0" || m[2][0] === "1")) {
                tokens.push(m[2][0]);
                argPos++;
                const rest = m[2].slice(1);
                if (rest.length > 0) {
                  const mod2 = argPos % 7;
                  if (mod2 === 4 && rest.length > 1 && (rest[0] === "0" || rest[0] === "1")) {
                    tokens.push(rest[0]);
                    argPos++;
                    tokens.push(rest.slice(1));
                    argPos++;
                  } else {
                    tokens.push(rest);
                    argPos++;
                  }
                }
                continue;
              }
            }
            tokens.push(m[2]);
            argPos++;
          }
        }
        return tokens;
      };

      const parsePathToSubpaths = (d) => {
        const tokens = tokenizePathData(d);
        const subpaths = [];
        let currentSub = null;
        let idx = 0;
        let cmd = "";
        let cx = 0, cy = 0, sx = 0, sy = 0;

        while (idx < tokens.length) {
          if (/^[A-Za-z]$/.test(tokens[idx])) {
            cmd = tokens[idx++];
          }
          const upper = cmd.toUpperCase();
          const isRel = cmd !== upper;
          const pCount = PARAM_COUNTS[upper];
          if (pCount === undefined) break;

          if (upper === "Z") {
            if (currentSub) {
              currentSub.cmds.push({ type: "Z", pts: [] });
              cx = sx;
              cy = sy;
            }
            cmd = "";
            continue;
          }

          if (idx + pCount > tokens.length) break;
          const nums = [];
          for (let k = 0; k < pCount; k++) {
            nums.push(parseFloat(tokens[idx++]));
          }

          if (upper === "M") {
            const x = isRel ? cx + nums[0] : nums[0];
            const y = isRel ? cy + nums[1] : nums[1];
            currentSub = { cmds: [{ type: "M", pts: [{ x, y }] }] };
            subpaths.push(currentSub);
            cx = sx = x;
            cy = sy = y;
            cmd = isRel ? "l" : "L";
            continue;
          }

          if (!currentSub) {
            currentSub = { cmds: [] };
            subpaths.push(currentSub);
          }

          if (upper === "L") {
            const x = isRel ? cx + nums[0] : nums[0];
            const y = isRel ? cy + nums[1] : nums[1];
            currentSub.cmds.push({ type: "L", pts: [{ x, y }] });
            cx = x; cy = y;
          } else if (upper === "H") {
            const x = isRel ? cx + nums[0] : nums[0];
            currentSub.cmds.push({ type: "L", pts: [{ x, y: cy }] });
            cx = x;
          } else if (upper === "V") {
            const y = isRel ? cy + nums[0] : nums[0];
            currentSub.cmds.push({ type: "L", pts: [{ x: cx, y }] });
            cy = y;
          } else if (upper === "C") {
            const pts = [
              { x: isRel ? cx + nums[0] : nums[0], y: isRel ? cy + nums[1] : nums[1] },
              { x: isRel ? cx + nums[2] : nums[2], y: isRel ? cy + nums[3] : nums[3] },
              { x: isRel ? cx + nums[4] : nums[4], y: isRel ? cy + nums[5] : nums[5] }
            ];
            currentSub.cmds.push({ type: "C", pts });
            cx = pts[2].x; cy = pts[2].y;
          } else if (upper === "S" || upper === "Q") {
            const pts = [
              { x: isRel ? cx + nums[0] : nums[0], y: isRel ? cy + nums[1] : nums[1] },
              { x: isRel ? cx + nums[2] : nums[2], y: isRel ? cy + nums[3] : nums[3] }
            ];
            currentSub.cmds.push({ type: upper, pts });
            cx = pts[1].x; cy = pts[1].y;
          } else if (upper === "T") {
            const x = isRel ? cx + nums[0] : nums[0];
            const y = isRel ? cy + nums[1] : nums[1];
            currentSub.cmds.push({ type: "T", pts: [{ x, y }] });
            cx = x; cy = y;
          } else if (upper === "A") {
            const x = isRel ? cx + nums[5] : nums[5];
            const y = isRel ? cy + nums[6] : nums[6];
            currentSub.cmds.push({
              type: "A",
              arc: [nums[0], nums[1], nums[2], nums[3], nums[4]],
              pts: [{ x, y }]
            });
            cx = x; cy = y;
          }
        }
        return subpaths;
      };

      const resolveSvgElement = async () => {
        let svgEl = stage.querySelector("svg");
        if (!svgEl || svgEl === stirHint.querySelector("svg")) {
          const resp = await fetch("./google_logo_image_of_steven_kleynenberg_at_gmail_dot_com.svg");
          if (!resp.ok) {
            throw new Error("Kan google_logo_image_of_steven_kleynenberg_at_gmail_dot_com.svg niet laden (" + resp.status + ")");
          }
          const xmlText = await resp.text();
          const doc = new DOMParser().parseFromString(xmlText, "image/svg+xml");
          const parsedSvg = doc.querySelector("svg");
          if (!parsedSvg) {
            throw new Error("Ongeldig SVG-document ontvangen.");
          }
          const hintNode = stirHint;
          stage.innerHTML = "";
          svgEl = document.importNode(parsedSvg, true);
          stage.appendChild(svgEl);
          stage.appendChild(hintNode);
        }
        return svgEl;
      };

      /* --------------------------------------------------------------------
- 5. Pure JavaScript Float32Array Organic Physics & Stirring Engine
- -------------------------------------------------------------------- */
      const startEngine = async () => {
        const svgEl = await resolveSvgElement();
        svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");
        svgEl.setAttribute("shape-rendering", "geometricPrecision");
        svgEl.removeAttribute("width");
        svgEl.removeAttribute("height");

        if (!svgEl.hasAttribute("viewBox")) {
          try {
            const rootBox = svgEl.getBBox();
            if (rootBox.width > 0 && rootBox.height > 0) {
              svgEl.setAttribute("viewBox", `${rootBox.x} ${rootBox.y} ${rootBox.width} ${rootBox.height}`);
            }
          } catch (_) {}
        }

        if (!svgEl.querySelector("title")) {
          const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
          t.textContent = "Steven Kleynenberg Interactive Vector Artwork Engine";
          svgEl.prepend(t);
        }
        if (!svgEl.querySelector("desc")) {
          const d = document.createElementNS("http://www.w3.org/2000/svg", "desc");
          d.textContent = "Procedural physics simulation representing Kleynenberg Publishers artwork under MIT license.";
          svgEl.prepend(d);
        }
        svgEl.setAttribute("role", "img");
        svgEl.setAttribute("aria-label", "Interactive logo artwork of Steven Kleynenberg");

        updateResponsiveLayout();

        // Show stir hint after a brief moment, auto-hide on first interaction
        setTimeout(() => {
          if (activePointers.size === 0) stirHint.classList.add("active");
        }, 1200);

        const hideHint = () => {
          stirHint.classList.remove("active");
        };

        const pathRecords = [];
        const polyRecords = [];
        const lineRecords = [];
        const allCoords = [];
        let totalSubpaths = 0;

        svgEl.querySelectorAll("path").forEach((el) => {
          const d = el.getAttribute("d");
          if (!d) return;
          const subpaths = parsePathToSubpaths(d);
          totalSubpaths += subpaths.length;
          for (const sub of subpaths) {
            for (const c of sub.cmds) {
              for (const p of c.pts) {
                allCoords.push(p);
              }
            }
          }
          pathRecords.push({ el, subpaths });
        });

        svgEl.querySelectorAll("polygon, polyline").forEach((el) => {
          const raw = el.getAttribute("points");
          if (!raw) return;
          const nums = (raw.match(/[+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/g) || []).map(Number);
          const pts = [];
          for (let i = 0; i + 1 < nums.length; i += 2) {
            const p = { x: nums[i], y: nums[i + 1] };
            allCoords.push(p);
            pts.push(p);
          }
          if (pts.length > 0) {
            polyRecords.push({ el, pts });
          }
        });

        svgEl.querySelectorAll("line").forEach((el) => {
          const p1 = { x: parseFloat(el.getAttribute("x1") || "0"), y: parseFloat(el.getAttribute("y1") || "0") };
          const p2 = { x: parseFloat(el.getAttribute("x2") || "0"), y: parseFloat(el.getAttribute("y2") || "0") };
          allCoords.push(p1, p2);
          lineRecords.push({ el, p1, p2 });
        });

        let localMinX = Infinity, localMinY = Infinity;
        let localMaxX = -Infinity, localMaxY = -Infinity;
        for (const p of allCoords) {
          if (p.x < localMinX) localMinX = p.x;
          if (p.x > localMaxX) localMaxX = p.x;
          if (p.y < localMinY) localMinY = p.y;
          if (p.y > localMaxY) localMaxY = p.y;
        }

        const hasOuterCirclePrimitive = svgEl.querySelector("circle, ellipse, rect") !== null;
        svgEl.querySelectorAll("circle, ellipse").forEach((el) => {
          const ccx = parseFloat(el.getAttribute("cx") || "0");
          const ccy = parseFloat(el.getAttribute("cy") || "0");
          const rx = parseFloat(el.getAttribute("r") || el.getAttribute("rx") || "0");
          const ry = parseFloat(el.getAttribute("r") || el.getAttribute("ry") || "0");
          if (rx > 0 && ry > 0) {
            if (ccx - rx < localMinX) localMinX = ccx - rx;
            if (ccx + rx > localMaxX) localMaxX = ccx + rx;
            if (ccy - ry < localMinY) localMinY = ccy - ry;
            if (ccy + ry > localMaxY) localMaxY = ccy + ry;
          }
        });

        if (!Number.isFinite(localMinX)) {
          const vb = (svgEl.getAttribute("viewBox") || "0 0 1000 1000").trim().split(/[\s,]+/).map(Number);
          localMinX = vb[0] || 0;
          localMinY = vb[1] || 0;
          localMaxX = localMinX + (vb[2] || 1000);
          localMaxY = localMinY + (vb[3] || 1000);
        }

        const localW = Math.max(1, localMaxX - localMinX);
        const localH = Math.max(1, localMaxY - localMinY);
        const cx = localMinX + localW * 0.5;
        const cy = localMinY + localH * 0.5;
        const radius = Math.min(localW, localH) * 0.5;
        const maxR = radius * 0.91;

        const isOuterCircleSubpath = (sub) => {
          if (totalSubpaths <= 1 && !hasOuterCirclePrimitive) return false;
          let sMinX = Infinity, sMaxX = -Infinity, sMinY = Infinity, sMaxY = -Infinity;
          for (const c of sub.cmds) {
            for (const p of c.pts) {
              if (p.x < sMinX) sMinX = p.x;
              if (p.x > sMaxX) sMaxX = p.x;
              if (p.y < sMinY) sMinY = p.y;
              if (p.y > sMaxY) sMaxY = p.y;
            }
          }
          return ((sMaxX - sMinX) / localW > 0.88) && ((sMaxY - sMinY) / localH > 0.88);
        };

        const movableNodes = [];
        for (const rec of pathRecords) {
          for (const sub of rec.subpaths) {
            if (isOuterCircleSubpath(sub)) continue;
            for (const c of sub.cmds) {
              for (const p of c.pts) {
                p.idx = movableNodes.length;
                movableNodes.push(p);
              }
            }
          }
        }
        for (const rec of polyRecords) {
          for (const p of rec.pts) {
            p.idx = movableNodes.length;
            movableNodes.push(p);
          }
        }
        for (const rec of lineRecords) {
          rec.p1.idx = movableNodes.length;
          movableNodes.push(rec.p1);
          rec.p2.idx = movableNodes.length;
          movableNodes.push(rec.p2);
        }

        if (movableNodes.length === 0) {
          for (const rec of pathRecords) {
            for (const sub of rec.subpaths) {
              for (const c of sub.cmds) {
                for (const p of c.pts) {
                  p.idx = movableNodes.length;
                  movableNodes.push(p);
                }
              }
            }
          }
        }

        const nodeCount = movableNodes.length;
        stage.dataset.engineStatus = "running-js";
        stage.dataset.nodeCount = String(nodeCount);
        if (nodeCount === 0) return;

        const coordRefEl =
          (pathRecords[0] && pathRecords[0].el) ||
          (polyRecords[0] && polyRecords[0].el) ||
          (lineRecords[0] && lineRecords[0].el) ||
          svgEl;

        const clientToLocalSvg = (clientX, clientY) => {
          const ctm = coordRefEl.getScreenCTM ? coordRefEl.getScreenCTM() : null;
          if (ctm) {
            const inv = ctm.inverse();
            return {
              x: clientX * inv.a + clientY * inv.c + inv.e,
              y: clientX * inv.b + clientY * inv.d + inv.f
            };
          }
          const rect = svgEl.getBoundingClientRect();
          return {
            x: localMinX + ((clientX - rect.left) / Math.max(1, rect.width)) * localW,
            y: localMinY + ((clientY - rect.top) / Math.max(1, rect.height)) * localH
          };
        };

        const activePointers = new Map();
        const diag = Math.hypot(localW, localH);
        const stirRadius = radius * 0.44;
        const stirRadiusSq = stirRadius * stirRadius;
        const twoSigmaSq = 2 * Math.pow(radius * 0.21, 2);

        const clampToOuterCircle = (px, py, limitR) => {
          const dx = px - cx;
          const dy = py - cy;
          const d = Math.hypot(dx, dy);
          if (d <= limitR || d < 1e-6) return { x: px, y: py, dist: d };
          const s = limitR / d;
          return { x: cx + dx * s, y: cy + dy * s, dist: limitR };
        };

        svgEl.addEventListener("pointerdown", (ev) => {
          hideHint();
          const pt = clientToLocalSvg(ev.clientX, ev.clientY);
          const dCenter = Math.hypot(pt.x - cx, pt.y - cy);
          if (dCenter > radius) return;

          if (svgEl.setPointerCapture) {
            try { svgEl.setPointerCapture(ev.pointerId); } catch (_) {}
          }
          svgEl.classList.add("stirring");
          ensureStirAudio();
          pulseHaptic(8, 30);

          const clamped = clampToOuterCircle(pt.x, pt.y, maxR);
          activePointers.set(ev.pointerId, {
            x: clamped.x,
            y: clamped.y,
            vx: 0,
            vy: 0,
            lastT: performance.now()
          });
        });

        svgEl.addEventListener("pointermove", (ev) => {
          const ptr = activePointers.get(ev.pointerId);
          if (!ptr) return;

          const now = performance.now();
          const dtP = Math.max((now - ptr.lastT) * 0.001, 0.004);
          const rawPt = clientToLocalSvg(ev.clientX, ev.clientY);
          const clamped = clampToOuterCircle(rawPt.x, rawPt.y, maxR);

          const instVx = (clamped.x - ptr.x) / dtP;
          const instVy = (clamped.y - ptr.y) / dtP;
          ptr.vx = ptr.vx * 0.35 + instVx * 0.65;
          ptr.vy = ptr.vy * 0.35 + instVy * 0.65;
          ptr.x = clamped.x;
          ptr.y = clamped.y;
          ptr.lastT = now;

          const speedNorm = Math.min(Math.hypot(ptr.vx, ptr.vy) / (diag * 1.35), 1.0);
          if (speedNorm > 0.025) {
            pulseHaptic(Math.round(5 + speedNorm * 7), 48);
            updateStirAudio(speedNorm, clamped.dist / Math.max(1, radius));
          }
        });

        const releasePointer = (ev) => {
          activePointers.delete(ev.pointerId);
          if (activePointers.size === 0) {
            svgEl.classList.remove("stirring");
            updateStirAudio(0, 0);
          }
        };

        svgEl.addEventListener("pointerup", releasePointer);
        svgEl.addEventListener("pointercancel", releasePointer);

        const state = new Float32Array(nodeCount * 6);
        const cruiseSpeed = diag * 0.038;
        const minSpeed = cruiseSpeed * 0.30;
        const maxSpeed = diag * 0.085;
        const stirMaxSpeed = diag * 0.85;
        const springK = 2.35;
        const dampingRate = 0.52;

        for (let i = 0; i < nodeCount; i++) {
          const base = i * 6;
          const x0 = movableNodes[i].x;
          const y0 = movableNodes[i].y;
          const nx = (x0 - localMinX) / localW;
          const ny = (y0 - localMinY) / localH;

          const flowAngle = Math.sin(nx * Math.PI * 1.8 + ny * Math.PI * 1.2) * 2.2;
          const speed = cruiseSpeed * (0.7 + 0.3 * Math.cos(nx * Math.PI));

          state[base + 0] = x0;
          state[base + 1] = y0;
          state[base + 2] = Math.cos(flowAngle) * speed;
          state[base + 3] = Math.sin(flowAngle) * speed;
          state[base + 4] = x0;
          state[base + 5] = y0;
        }

        const stepPhysics = (dt, totalTime) => {
          const damp = Math.exp(-dampingRate * dt);
          const isStirring = activePointers.size > 0;
          const activeCap = isStirring ? stirMaxSpeed : maxSpeed;
          let maxPointerSpeed = 0;
          let rimImpactStrength = 0;

          if (isStirring) {
            const ptrDecay = Math.exp(-9.0 * dt);
            for (const ptr of activePointers.values()) {
              const pSpd = Math.hypot(ptr.vx, ptr.vy);
              if (pSpd > maxPointerSpeed) maxPointerSpeed = pSpd;
              ptr.vx *= ptrDecay;
              ptr.vy *= ptrDecay;
            }
          }

          for (let i = 0; i < nodeCount; i++) {
            const b = i * 6;
            let x = state[b + 0];
            let y = state[b + 1];
            let vx = state[b + 2];
            let vy = state[b + 3];
            const x0 = state[b + 4];
            const y0 = state[b + 5];

            if (isStirring) {
              for (const ptr of activePointers.values()) {
                const rx = x - ptr.x;
                const ry = y - ptr.y;
                const d2 = rx * rx + ry * ry;
                if (d2 < stirRadiusSq) {
                  const w = Math.exp(-d2 / twoSigmaSq);
                  x += ptr.vx * dt * w * 0.72;
                  y += ptr.vy * dt * w * 0.72;
                  const blend = Math.min(1, 14.0 * dt) * w;
                  vx += (ptr.vx - vx) * blend - ry * 0.9 * w * dt;
                  vy += (ptr.vy - vy) * blend + rx * 0.9 * w * dt;
                }
              }
            }

            const nx0 = (x0 - localMinX) / localW;
            const ny0 = (y0 - localMinY) / localH;
            const flowForceX = Math.cos(totalTime * 0.6 + nx0 * Math.PI * 2.0 + ny0 * Math.PI * 1.5) * diag * 0.015;
            const flowForceY = Math.sin(totalTime * 0.6 + nx0 * Math.PI * 1.5 + ny0 * Math.PI * 2.0) * diag * 0.015;

            vx = vx * damp + flowForceX * dt + (x0 - x) * springK * dt;
            vy = vy * damp + flowForceY * dt + (y0 - y) * springK * dt;

            const spdSq = vx * vx + vy * vy;
            if (spdSq > activeCap * activeCap) {
              const s = activeCap / Math.sqrt(spdSq);
              vx *= s;
              vy *= s;
            } else if (spdSq < minSpeed * minSpeed) {
              if (spdSq > 1e-12) {
                const s = minSpeed / Math.sqrt(spdSq);
                vx *= s;
                vy *= s;
              } else {
                const a = Math.random() * Math.PI * 2;
                vx = Math.cos(a) * minSpeed;
                vy = Math.sin(a) * minSpeed;
              }
            }

            x += vx * dt;
            y += vy * dt;

            const dxC = x - cx;
            const dyC = y - cy;
            const distC = Math.hypot(dxC, dyC);
            if (distC > maxR && distC > 1e-6) {
              const nx = dxC / distC;
              const ny = dyC / distC;
              x = cx + nx * maxR;
              y = cy + ny * maxR;

              const vn = vx * nx + vy * ny;
              if (vn > 0) {
                vx -= 1.88 * vn * nx;
                vy -= 1.88 * vn * ny;
                if (isStirring && vn > cruiseSpeed * 2.2) {
                  const strength = Math.min(1, vn / (diag * 0.45));
                  if (strength > rimImpactStrength) rimImpactStrength = strength;
                }
              }
            }

            state[b + 0] = x;
            state[b + 1] = y;
            state[b + 2] = vx;
            state[b + 3] = vy;
          }

          if (isStirring && maxPointerSpeed < diag * 0.03) {
            updateStirAudio(0, 0);
          }
          if (rimImpactStrength > 0.08) {
            pulseHaptic(14, 85);
            triggerRimAudioPing(rimImpactStrength);
          }
        };

        const serializeSubpaths = (subpaths) => {
          let out = "";
          for (const sub of subpaths) {
            for (const c of sub.cmds) {
              if (c.type === "Z") {
                out += "Z";
              } else if (c.type === "A") {
                const p = c.pts[0];
                const x = p.idx !== undefined ? state[p.idx * 6] : p.x;
                const y = p.idx !== undefined ? state[p.idx * 6 + 1] : p.y;
                out += `A${c.arc[0]} ${c.arc[1]} ${c.arc[2]} ${c.arc[3]} ${c.arc[4]} ${x.toFixed(3)} ${y.toFixed(3)}`;
              } else {
                out += c.type;
                for (let k = 0; k < c.pts.length; k++) {
                  const p = c.pts[k];
                  const x = p.idx !== undefined ? state[p.idx * 6] : p.x;
                  const y = p.idx !== undefined ? state[p.idx * 6 + 1] : p.y;
                  out += (k > 0 ? " " : "") + `${x.toFixed(3)} ${y.toFixed(3)}`;
                }
              }
            }
          }
          return out;
        };

        let lastTime = performance.now();
        let totalElapsedSeconds = 0;
        let renderedFrames = 39846;

        const frame = (now) => {
          const rawMs = now - lastTime;
          lastTime = now;

          const dt = Math.min(Math.max(rawMs * 0.001, 0.001), 0.033333);
          totalElapsedSeconds += dt;
          stepPhysics(dt, totalElapsedSeconds);

          for (let r = 0; r < pathRecords.length; r++) {
            pathRecords[r].el.setAttribute("d", serializeSubpaths(pathRecords[r].subpaths));
          }
          for (let r = 0; r < polyRecords.length; r++) {
            const pts = polyRecords[r].pts;
            let s = "";
            for (let k = 0; k < pts.length; k++) {
              const b = pts[k].idx * 6;
              s += (k > 0 ? " " : "") + `${state[b].toFixed(3)},${state[b + 1].toFixed(3)}`;
            }
            polyRecords[r].el.setAttribute("points", s);
          }
          for (let r = 0; r < lineRecords.length; r++) {
            const rec = lineRecords[r];
            rec.el.setAttribute("x1", state[rec.p1.idx * 6].toFixed(3));
            rec.el.setAttribute("y1", state[rec.p1.idx * 6 + 1].toFixed(3));
            rec.el.setAttribute("x2", state[rec.p2.idx * 6].toFixed(3));
            rec.el.setAttribute("y2", state[rec.p2.idx * 6 + 1].toFixed(3));
          }

          renderedFrames++;
          frameCountEl.textContent = String(renderedFrames).padStart(27, "0");
          clockHand.setAttribute("transform", `rotate(${((renderedFrames % 100) * 3.6 - 90).toFixed(1)} 8 8)`);

          requestAnimationFrame(frame);
        };

        requestAnimationFrame(frame);
      };

      startEngine().catch((err) => {
        stage.dataset.engineStatus = "error: " + err.message;
        console.error("index.html engine fout:", err);
      });
    })();
  </script>
