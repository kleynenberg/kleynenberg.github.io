      code_artifact:
        language: "ISO C"
        caption: "Authentic CALM_TYPE module specification excerpt from the MetaNet Network Environment (1990)"
        snippet: |
          typedef MODULE (int size) CALM_TYPE;

          syntax module {
              self, MODULE_size;
              self, CALM_TYPE;
              text, MODULE_label;
          };
      external_links:
        - label: "IEEE Xplore"
          url: "https://ieeexplore.ieee.org"
