  entries:
    - id: "paper_innc_1990"
      enabled: true
      archive_id: "KLP-1990-INNC"
      year: 1990
      title: "The MetaNet network environment for the development of modular neural networks"
      authors:
        - "Steven E. Kleynenberg"
        - "Jacob M. J. Murre"
      venue: "Proceedings of the International Neural Network Conference (INNC-90-Paris), Paris, France"
      doi: ""
      pdf_path: "papers/kleynenberg-murre-1990-metanet-innc.pdf"
      pdf_available: false
      external_url: "https://ieeexplore.ieee.org"
