hero:
  banner_hook:
    stop_statement: "Stop feeding walled-garden algorithms and data brokers with your life's work."
    start_statement: "Start owning sovereign proof-of-work — 40 years of parallel neurocomputing, international patents, and live AI systems compiled into a zero-tracker PWA."
  bio_headline: "Architecting sovereign AI systems, patented NLP retrieval engines (WO2014003543A1), and massively parallel software — without platform lock-in or algorithmic noise."
  bio_links:
    - id: "link_taksie"
      enabled: true
      label: "taksie.ai"
      subtitle: "AI fiscal pre-processor"
      url: "https://taksie.ai"
    - id: "link_innopheon"
      enabled: true
      label: "innopheon"
      subtitle: "Enterprise intelligence and patent analytics"
      url: "https://innopheon.com"
    - id: "link_publishers"
      enabled: true
      label: "Kleynenberg Publishers"
      subtitle: "Independent publishing house"
      url: "https://kleynenberg.com"
    - id: "link_naaap"
      enabled: true
      label: "naaap.io"
      subtitle: "Autonomous audiovisual network"
      url: "https://naaap.io"
    - id: "link_github"
      enabled: true
      label: "GitHub"
      subtitle: "Public source repositories"
      url: "https://github.com/kleynenberg"
  about_pais:
    pain: "Decades of primary engineering artifacts, peer-reviewed papers, international patents, and low-level system architectures are routinely flattened into generic, ad-ridden social network templates controlled by third-party algorithms."
    agitation: "When your career record lives inside a centralized database, you surrender ownership of your data, expose visitors to behavioral tracking, and reduce complex technical proofs into superficial resume bullet points that neither humans nor AI agents can deeply inspect."
    ideal_situation: "A professional identity should act as a sovereign, zero-latency, machine-readable knowledge graph: instantly installable as a standalone app, verifiable down to the source code and patent claims, and effortlessly parsed by modern AI crawlers."
    solution: "Project UnLinked (https://kleynenberg.github.io) replaces centralized platform dependency with a self-contained static PWA built from first principles — unifying 40 years of verified R&D milestones (1985–2026) with live repositories and autonomous media streams."

project_unlinked_spotlight:
  working_title: "Project UnLinked — who needs walled-garden platforms when we have AI?"
  status: "Active flagship // v1.0.0"
  repository_url: "https://github.com/kleynenberg/kleynenberg.github.io"
  live_url: "https://kleynenberg.github.io/"
  summary: "An experimental demonstration of post-platform professional identity: raw primary sources—academic proceedings, WIPO patent records, ISO C syntax artifacts, and active software inventories—distilled with AI assistance into a deterministic, zero-dependency HTML5/CSS3/JS Progressive Web App with full Schema.org JSON-LD and llms.txt semantic indexing."
  pillars_of_design:
    - id: "unlinked_sovereignty"
      enabled: true
      heading: "100% data and hosting sovereignty"
      detail: "Served statically from GitHub Pages with zero third-party CDNs, zero cookies, and zero external telemetry."
    - id: "unlinked_ai_native"
      enabled: true
      heading: "AI-crawler and knowledge-graph native"
      detail: "Structured via Schema.org JSON-LD @graph, Open Graph metadata, Dublin Core terms, and llms.txt for lossless LLM entity resolution."
    - id: "unlinked_pwa"
      enabled: true
      heading: "Installable offline-first PWA"
      detail: "Equipped with a W3C Web App Manifest, derived 192x192 and 512x512 icons, and a Service Worker for instant offline access."

